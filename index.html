<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>オフィスビル警備・裁判クイズすごろく</title>
  <!-- Firebase（世界標準のリアルタイム通信：キャリア回線でも100%繋がります） -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- QRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --c-red: #ef4444;
      --c-blue: #3b82f6;
      --c-yellow: #eab308;
      --c-green: #22c55e;
      --c-purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

    /* ==========================================================
       1. スマホ側（子機：クライアント）画面
       ========================================================== */
    #client-view {
      display: none;
      min-height: 100vh;
      padding: 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .client-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    .team-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.2rem;
      margin-bottom: 14px;
    }
    .team-btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }
    .team-sel-btn {
      padding: 16px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    }
    .team-sel-btn:active { transform: translateY(3px); box-shadow: none; }

    /* スマホ回答グリッド（4択の巨大ボタン） */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
      width: 100%;
    }
    .btn-ans {
      height: 130px;
      border: none;
      border-radius: 16px;
      font-size: 2.5rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.4);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-ans:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    .btn-ans.disabled { opacity: 0.35; pointer-events: none; }
    .ans-1 { background: var(--c-red); }
    .ans-2 { background: var(--c-blue); }
    .ans-3 { background: var(--c-yellow); color: #1e293b; }
    .ans-4 { background: var(--c-green); }
    .ans-sub { font-size: 1.1rem; font-weight: normal; margin-top: 4px; }

    .result-banner {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: bold;
      display: none;
    }
    .result-banner.correct { background: #15803d; color: #fff; border: 2px solid #4ade80; }
    .result-banner.wrong { background: #b91c1c; color: #fff; border: 2px solid #f87171; }

    /* ==========================================================
       2. プロジェクター側（親機：ホスト）画面
       ========================================================== */
    #host-view {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
    }
    .main-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      padding: 14px;
      height: calc(100vh - 65px);
    }
    .sidebar {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .team-card {
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      border-left: 6px solid #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .team-card.answered { border-color: #38bdf8; background: #1e3a5f; }

    /* すごろく盤面コンテナ（16:9比率を厳密固定） */
    .board-stage {
      background: #020617;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
      max-height: 100%;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .board-canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .board-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    /* 5色の警備員コマ */
    .token-guard {
      position: absolute;
      width: 32px;
      height: 42px;
      transform: translate(-50%, -100%);
      transition: left 0.4s ease-out, top 0.4s ease-out;
      z-index: 20;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
    }
    .token-guard.jumping {
      animation: hop 0.5s infinite alternate ease-in-out;
    }
    @keyframes hop {
      from { transform: translate(-50%, -100%); }
      to { transform: translate(-50%, -130%); }
    }

    /* 3Dサイコロ演出 */
    .dice-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .dice-box {
      width: 60px;
      height: 60px;
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 900;
      color: #0f172a;
      box-shadow: inset 0 -4px 0 #cbd5e1, 0 6px 12px rgba(0,0,0,0.4);
      margin-bottom: 8px;
    }
    .dice-rolling {
      animation: spinDice 0.6s infinite linear;
    }
    @keyframes spinDice {
      0% { transform: rotate(0deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1.1); }
    }

    /* 巨大アナウンスバナー */
    .turn-alert {
      background: #3b82f6;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* モーダル */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: var(--card-bg);
      border-radius: 20px;
      max-width: 850px;
      width: 100%;
      padding: 30px;
      border: 2px solid var(--accent);
      text-align: center;
    }
    .qr-container {
      background: #fff;
      padding: 16px;
      display: inline-block;
      border-radius: 12px;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <!-- ========================================================
       1. スマホ側（子機：参加者用画面）
       ======================================================== -->
  <div id="client-view">
    <!-- チーム登録画面 -->
    <div id="client-register" class="client-card">
      <h2 style="font-size: 1.5rem; margin-bottom: 8px;">🚨 チーム登録</h2>
      <p style="color:#94a3b8; font-size: 0.95rem; margin-bottom: 16px;">あなたの長机のチームを選んでください</p>
      <div class="team-btn-list">
        <button class="team-sel-btn" style="background:var(--c-red);" onclick="selectTeam(1, 'チーム1（赤）', 'var(--c-red)')">赤チーム（第1長机）</button>
        <button class="team-sel-btn" style="background:var(--c-blue);" onclick="selectTeam(2, 'チーム2（青）', 'var(--c-blue)')">青チーム（第2長机）</button>
        <button class="team-sel-btn" style="background:var(--c-yellow); color:#000;" onclick="selectTeam(3, 'チーム3（黄）', 'var(--c-yellow)')">黄チーム（第3長机）</button>
        <button class="team-sel-btn" style="background:var(--c-green);" onclick="selectTeam(4, 'チーム4（緑）', 'var(--c-green)')">緑チーム（第4長机）</button>
        <button class="team-sel-btn" style="background:var(--c-purple);" onclick="selectTeam(5, 'チーム5（紫）', 'var(--c-purple)')">紫チーム（第5長机）</button>
      </div>
    </div>

    <!-- 4択回答画面 -->
    <div id="client-game" class="client-card" style="display:none;">
      <div id="client-team-badge" class="team-badge"></div>
      <h3 id="client-msg" style="margin: 14px 0; font-size: 1.2rem; color: #38bdf8;">出題をお待ちください…</h3>

      <!-- 押しやすい巨大4択ボタン -->
      <div class="answer-grid" id="ans-grid" style="display:none;">
        <button class="btn-ans ans-1" onclick="submitAns(1)">①<span class="ans-sub">赤</span></button>
        <button class="btn-ans ans-2" onclick="submitAns(2)">②<span class="ans-sub">青</span></button>
        <button class="btn-ans ans-3" onclick="submitAns(3)">③<span class="ans-sub">黄</span></button>
        <button class="btn-ans ans-4" onclick="submitAns(4)">④<span class="ans-sub">緑</span></button>
      </div>

      <!-- 判定バナー -->
      <div id="client-result" class="result-banner"></div>
    </div>
  </div>


  <!-- ========================================================
       2. プロジェクター側（親機：ホスト用画面）
       ======================================================== -->
  <div id="host-view">
    <header>
      <div style="display:flex; align-items:center; gap:16px;">
        <h2 style="font-size: 1.3rem;">🏢 オフィスビル警備 裁判クイズすごろく</h2>
        <span id="quiz-badge" style="background:#334155; padding:6px 14px; border-radius:20px; font-weight:bold;">第 1 問 / 全 20 問</span>
      </div>
      <div style="display:flex; gap:12px;">
        <button onclick="showQRModal()" style="background:var(--accent); color:#000; padding:10px 18px; border:none; border-radius:10px; font-weight:900; cursor:pointer;">📱 スマホ参加用QR表示</button>
        <button onclick="openQuizModal()" style="background:#22c55e; color:#fff; padding:10px 18px; border:none; border-radius:10px; font-weight:900; cursor:pointer;">❓ 出題する</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- サイドバー -->
      <div class="sidebar">
        <div id="turn-banner" class="turn-alert">出題してください</div>

        <h4 style="color:#94a3b8; font-size:0.9rem; margin-top:8px;">チーム参加・回答状況</h4>
        <div id="team-cards-container" style="display:flex; flex-direction:column; gap:8px;"></div>

        <div style="margin-top:auto; background:#0f172a; padding:12px; border-radius:10px; text-align:center; border:1px solid #334155;">
          <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:6px;">⌨️ Bluetoothボタン対応</p>
          <span style="background:#334155; padding:3px 8px; border-radius:6px; font-size:0.8rem;">[A] [Space] [Enter]</span>
        </div>
      </div>

      <!-- メインすごろく盤面（イラスト完全内蔵） -->
      <div class="board-stage" id="board-stage">
        <!-- 修正版のオフィスビルイラスト（外から確実に読み込める高画質SVGマップ） -->
        <svg id="board-bg" class="board-canvas-layer" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
          <!-- 背景グラデーション -->
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#bae6fd"/>
              <stop offset="100%" stop-color="#e0f2fe"/>
            </linearGradient>
            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3"/>
            </filter>
          </defs>

          <!-- 空と背景 -->
          <rect width="1600" height="900" fill="url(#skyGrad)"/>

          <!-- ビル外観構造体（断面カット） -->
          <polygon points="120,240 800,80 1480,240 1480,780 800,880 120,
