<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>オフィスビル警備・裁判クイズすごろく</title>
  <!-- Firebase SDK（クラウド中継用：確実に繋がります） -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- QRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --red: #ef4444;
      --blue: #3b82f6;
      --yellow: #eab308;
      --green: #22c55e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); }

    /* スマホ画面 */
    #client-view {
      display: none;
      min-height: 100vh;
      padding: 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .ans-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }
    .btn-ans {
      height: 120px;
      border: none;
      border-radius: 14px;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    }
    .btn-ans:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .btn-ans.disabled { opacity: 0.3; pointer-events: none; }
    .btn-1 { background: var(--red); }
    .btn-2 { background: var(--blue); }
    .btn-3 { background: var(--yellow); color: #000; }
    .btn-4 { background: var(--green); }
    .res-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: bold;
      display: none;
    }
    .res-box.ok { background: #15803d; color: #fff; }
    .res-box.ng { background: #b91c1c; color: #fff; }

    /* 親機画面 */
    #host-view {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }
    header {
      background: var(--card-bg);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
    }
    .host-body {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      padding: 16px;
    }
    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    .modal-card {
      background: var(--card-bg); border-radius: 20px; max-width: 700px; width: 100%; padding: 32px;
      border: 2px solid var(--accent); text-align: center;
    }
  </style>
</head>
<body>

  <!-- スマホ（子機） -->
  <div id="client-view">
    <div id="reg-screen" class="card">
      <h2 style="margin-bottom:12px;">🚨 チーム登録</h2>
      <p style="color:#94a3b8; margin-bottom:16px;">自席のチームを選択してください</p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button onclick="registerTeam(1, 'チーム1（赤）', '#ef4444')" style="background:#ef4444; color:#fff; padding:14px; border:none; border-radius:10px; font-weight:bold;">赤チーム（第1長机）</button>
        <button onclick="registerTeam(2, 'チーム2（青）', '#3b82f6')" style="background:#3b82f6; color:#fff; padding:14px; border:none; border-radius:10px; font-weight:bold;">青チーム（第2長机）</button>
        <button onclick="registerTeam(3, 'チーム3（黄）', '#eab308')" style="background:#eab308; color:#000; padding:14px; border:none; border-radius:10px; font-weight:bold;">黄チーム（第3長机）</button>
        <button onclick="registerTeam(4, 'チーム4（緑）', '#22c55e')" style="background:#22c55e; color:#fff; padding:14px; border:none; border-radius:10px; font-weight:bold;">緑チーム（第4長机）</button>
        <button onclick="registerTeam(5, 'チーム5（紫）', '#a855f7')" style="background:#a855f7; color:#fff; padding:14px; border:none; border-radius:10px; font-weight:bold;">紫チーム（第5長机）</button>
      </div>
    </div>

    <div id="play-screen" class="card" style="display:none;">
      <div id="my-badge" style="display:inline-block; padding:6px 16px; border-radius:20px; font-weight:bold; margin-bottom:10px;"></div>
      <h3 id="client-msg" style="color:#94a3b8; margin:10px 0;">出題をお待ちください…</h3>

      <div class="ans-grid" id="ans-box" style="display:none;">
        <button class="btn-ans btn-1" onclick="sendAns(1)">①</button>
        <button class="btn-ans btn-2" onclick="sendAns(2)">②</button>
        <button class="btn-ans btn-3" onclick="sendAns(3)">③</button>
        <button class="btn-ans btn-4" onclick="sendAns(4)">④</button>
      </div>

      <div id="res-banner" class="res-box"></div>
    </div>
  </div>

  <!-- PC（親機） -->
  <div id="host-view">
    <header>
      <h2>🏢 オフィスビル警備 裁判クイズすごろく</h2>
      <div style="display:flex; gap:10px;">
        <button onclick="showQR()" style="background:var(--accent); color:#000; padding:8px 16px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">📱 QR表示</button>
        <button onclick="openQuestionModal()" style="background:#22c55e; color:#fff; padding:8px 16px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">❓ 出題する</button>
      </div>
    </header>

    <div class="host-body">
      <div class="sidebar">
        <h3>チーム接続・回答状況</h3>
        <div id="host-team-status" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div style="margin-top:auto; background:#0f172a; padding:16px; border-radius:8px; text-align:center;">
          <h4 id="turn-announcement" style="color:var(--accent);">準備完了</h4>
          <p style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">正解チームにサイコロボタンを渡してください</p>
        </div>
      </div>

      <div style="background:#000; border-radius:12px; display:flex; align-items:center; justify-content:center; position:relative;">
        <img src="watermarked_img_9980905747072171036.jpg" style="width:100%; height:100%; object-fit:contain;" alt="マップ">
      </div>
    </div>

    <!-- QRモーダル -->
    <div id="qr-modal" class="modal" style="display:none;">
      <div class="modal-card">
        <h2>スマホで読み取ってください</h2>
        <div id="qrcode" style="background:#fff; padding:16px; display:inline-block; border-radius:12px; margin:16px 0;"></div>
        <br>
        <button onclick="document.getElementById('qr-modal').style.display='none'" style="padding:8px 20px; background:#475569; color:#fff; border:none; border-radius:6px; cursor:pointer;">閉じる</button>
      </div>
    </div>

    <!-- 出題モーダル -->
    <div id="quiz-modal" class="modal" style="display:none;">
      <div class="modal-card" style="text-align:left;">
        <h2 style="color:var(--accent);">第 1 問：雨の日の転倒事故</h2>
        <p style="font-size:1.2rem; margin:16px 0;">雨天時、マットを設置していたが水滴で来館者が転倒。ビルの過失割合は？</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
          <div style="padding:12px; background:#ef444433; border:2px solid #ef4444; border-radius:8px;">① 責任なし（0%）</div>
          <div style="padding:12px; background:#3b82f633; border:2px solid #3b82f6; border-radius:8px;">② 過失20%</div>
          <div style="padding:12px; background:#eab30833; border:2px solid #eab308; border-radius:8px;">③ 過失50%</div>
          <div style="padding:12px; background:#22c55e33; border:2px solid #22c55e; border-radius:8px;">④ 過失80%</div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span id="answered-badge" style="color:var(--accent); font-weight:bold;">回答待ち...</span>
          <button onclick="reveal(1)" style="padding:12px 24px; background:#eab308; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">正解発表（①番）</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // ★ここをご自身のFirebase Realtime DatabaseのURLに書き換えてください★
    // ========================================================
    const firebaseConfig = {
      databaseURL: "https://your-project-default-rtdb.firebaseio.com" // ←ここを書き換え
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const stateRef = db.ref('game_state');

    const params = new URLSearchParams(window.location.search);
    const isClient = params.has('client');

    const teamMeta = [
      { id: 1, name: 'チーム1（赤）', color: '#ef4444' },
      { id: 2, name: 'チーム2（青）', color: '#3b82f6' },
      { id: 3, name: 'チーム3（黄）', color: '#eab308' },
      { id: 4, name: 'チーム4（緑）', color: '#22c55e' },
      { id: 5, name: 'チーム5（紫）', color: '#a855f7' }
    ];

    let myTeamId = null;

    if (!isClient) {
      // ------------------------------------
      // 親PC（ホスト）
      // ------------------------------------
      document.getElementById('host-view').style.display = 'flex';
      
      // ゲームステートの初期化
      stateRef.set({
        status: 'WAITING', // WAITING, QUESTION, REVEAL
        correctAnswer: 1,
        teams: { 1: { connected: false, ans: null }, 2: { connected: false, ans: null }, 3: { connected: false, ans: null }, 4: { connected: false, ans: null }, 5: { connected: false, ans: null } }
      });

      // 状態変更を常時監視
      stateRef.on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        renderHost(data);
      });

      // QR生成（?client=1 を付与）
      const clientUrl = window.location.origin + window.location.pathname + '?client=1';
      new QRCode(document.getElementById('qrcode'), { text: clientUrl, width: 220, height: 220 });

    } else {
      // ------------------------------------
      // スマホ（子機）
      // ------------------------------------
      document.getElementById('client-view').style.display = 'flex';

      stateRef.on('value', (snap) => {
        const data = snap.val();
        if (!data || !myTeamId) return;

        const myTeam = data.teams[myTeamId];
        const status = data.status;

        if (status === 'QUESTION') {
          document.getElementById('ans-box').style.display = 'grid';
          document.querySelectorAll('.btn-ans').forEach(b => b.classList.remove('disabled'));
          document.getElementById('res-banner').style.display = 'none';
          document.getElementById('client-msg').innerText = '選択肢をタップしてください！';
        } else if (status === 'REVEAL') {
          document.getElementById('ans-box').style.display = 'none';
          const banner = document.getElementById('res-banner');
          banner.style.display = 'block';

          if (myTeam.ans === data.correctAnswer) {
            banner.className = 'res-box ok';
            banner.innerText = '🎉 正解！サイコロの権利獲得！';
          } else {
            banner.className = 'res-box ng';
            banner.innerText = '😢 不正解…';
          }
          document.getElementById('client-msg').innerText = 'スクリーンをご覧ください';
        } else {
          document.getElementById('ans-box').style.display = 'none';
          document.getElementById('res-banner').style.display = 'none';
          document.getElementById('client-msg').innerText = '出題をお待ちください…';
        }
      });
    }

    // スマホ側関数
    function registerTeam(id, name, color) {
      myTeamId = id;
      document.getElementById('reg-screen').style.display = 'none';
      document.getElementById('play-screen').style.display = 'block';

      const b = document.getElementById('my-badge');
      b.innerText = name;
      b.style.background = color;
      b.style.color = (color === '#eab308') ? '#000' : '#fff';

      db.ref(`game_state/teams/${id}/connected`).set(true);
    }

    function sendAns(num) {
      document.querySelectorAll('.btn-ans').forEach(b => b.classList.add('disabled'));
      document.getElementById('client-msg').innerText = '回答送信完了！発表をお待ちください';
      db.ref(`game_state/teams/${myTeamId}/ans`).set(num);
    }

    // ホスト側関数
    function showQR() { document.getElementById('qr-modal').style.display = 'flex'; }
    function openQuestionModal() {
      document.getElementById('quiz-modal').style.display = 'flex';
      // 各チームの回答リセット＆出題中に更新
      const updates = { status: 'QUESTION' };
      [1,2,3,4,5].forEach(i => updates[`teams/${i}/ans`] = null);
      stateRef.update(updates);
    }

    function reveal(correctNum) {
      document.getElementById('quiz-modal').style.display = 'none';
      stateRef.update({
        status: 'REVEAL',
        correctAnswer: correctNum
      });
    }

    function renderHost(data) {
      const container = document.getElementById('host-team-status');
      let ansCount = 0;
      let html = '';

      teamMeta.forEach(m => {
        const t = data.teams ? data.teams[m.id] : null;
        const isConn = t && t.connected;
        const hasAns = t && t.ans !== null && t.ans !== undefined;
        if (hasAns) ansCount++;

        html += `
          <div style="background:#1e293b; padding:10px; border-radius:8px; border-left:6px solid ${m.color}; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong>${m.name}</strong><br>
              <span style="font-size:0.8rem; color:${isConn ? '#4ade80':'#64748b'};">${isConn ? '● 接続中' : '○ 待機中'}</span>
            </div>
            <span style="font-weight:bold; color:${hasAns ? '#38bdf8':'#64748b'};">${hasAns ? '回答済' : '未回答'}</span>
          </div>
        `;
      });
      container.innerHTML = html;
      const badge = document.getElementById('answered-badge');
      if (badge) badge.innerText = `回答状況：${ansCount} / 5 チーム`;
    }
  </script>
</body>
</html>
